services:
  postgres:
    image: postgres:15-alpine
    container_name: nhakhoa-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-dental_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio:latest
    container_name: nhakhoa-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BROWSER_REDIRECT_URL: http://100.93.48.110:9001
      MINIO_SERVER_URL: http://100.93.48.110:9000
    ports:
      - "9000:9000"     # MinIO API
      - "9001:9001"     # MinIO Console
    volumes:
      - minio_data:/minio/data
    command: server /minio/data --console-address ":9001"


  image-processor:
    build: ./image-processing-service
    container_name: nhakhoa-image-processor
    environment:
      HOST: 0.0.0.0
      PORT: 8001
      DEBUG: ${IMAGE_PROCESSOR_DEBUG:-False}
      BRACKET_CLASS: ${BRACKET_CLASS:-13}
      PADDING_PX: ${PADDING_PX:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "8001:8001"
    volumes:
      - ./image-processing-service:/app
      - processor_temp:/tmp


volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  processor_temp:
    driver: local

